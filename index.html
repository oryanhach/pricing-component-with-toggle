<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | [Challenge Name Here]</title>

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <main class="page">

    <header>
      <h1 class="pricing__title">
        Our Pricing
      </h1>

      <div class="pricing__toggle" role="group" aria-label="Billing period">
        <span class="pricing__toggle-label">Annually</span>

        <label class="toggle">
          <input class="toggle__input" type="checkbox" id="billing-toggle" />
          <span class="toggle__track" aria-hidden="true">
            <span class="toggle__thumb"></span>
          </span>
          <span class="sr-only">Toggle billing period</span>
        </label>

        <span class="pricing__toggle-label">Monthly</span>
      </div>

    </header>

    <section class="pricing__plans aria-label=" Pricing plans"">

      <article class="plan">

        <h2 class="plan__name">
          Basic
        </h2>
        <p class="plan__price">
          <span>&dollar;</span>19.99
        </p>
        <p class="plan__hr"></p>
        <p class="plan__storage">
          500 GB Storage
        </p>
        <p class="plan__hr"></p>
        <p class="plan__users">
          2 Users Allowed
        </p>
        <p class="plan__hr"></p>
        <p class="plan__space">
          Send up to 3 GB
        </p>
        <p class="plan__hr"></p>
        <a class="plan__cta" href="#">Learn More</a>

      </article>

      <article class="plan">

        <h2 class="plan__name">
          Professional
        </h2>
        <p class="plan__price">
          <span>&dollar;</span>24.99
        </p>
        <p class="plan__hr"></p>
        <p class="plan__storage">
          1 TB Storage
        </p>
        <p class="plan__hr"></p>
        <p class="plan__users">
          5 Users Allowed
        </p>
        <p class="plan__hr"></p>
        <p class="plan__space">
          Send up to 10 GB
        </p>
        <p class="plan__hr"></p>
        <a class="plan__cta" href="#">Learn More</a>

      </article>

      <article class="plan">

        <h2 class="plan__name">
          Master
        </h2>
        <p class="plan__price">
          <span>&dollar;</span>39.99
        </p>
        <p class="plan__hr"></p>
        <p class="plan__storage">
          2 TB Storage
        </p>
        <p class="plan__hr"></p>
        <p class="plan__users">
          10 Users Allowed
        </p>
        <p class="plan__hr"></p>
        <p class="plan__space">
          Send up to 20 GB
        </p>
        <p class="plan__hr"></p>
        <a class="plan__cta" href="#">Learn More</a>

      </article>

    </section>

  </main>

</body>

</html>
